version: 2

sources:
  - name: raw_biblioteca
    database: BIBLIOTECA_DEV_BRONZE_DB
    schema: BIBLIOTECA

    tables:
      - name: clientes
        columns:
          - name: idcliente
            data_type: number
          - name: nombre
            data_type: varchar
          - name: telefono
            data_type: number
          - name: email
            data_type: varchar
          - name: direccion
            data_type: varchar
          - name: ciudad
            data_type: varchar
          - name: fnacimiento
            data_type: date
          - name: falta
            data_type: date
          - name: fbaja
            data_type: date
          - name: genero
            data_type: varchar
          - name: activo
            data_type: varchar
          - name: creado_en
            data_type: timestamp_ntz
          - name: modificado_en
            data_type: timestamp_ntz

      - name: ejemplares
        columns:
          - name: idlibro
            data_type: number
          - name: nejemplar
            data_type: number
