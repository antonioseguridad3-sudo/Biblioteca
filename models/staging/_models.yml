version: 2

models:
  - name: stg_clientes
    description: "Modelo staging de clientes"
    columns:
      - name: id_cliente
        description: "Identificador único del cliente"
        tests:
          - not_null
          - unique

      - name: nombre
        description: "Nombre del cliente"

      - name: telefono
        description: "Teléfono del cliente"

      - name: email
        description: "Correo electrónico del cliente"

      - name: direccion
        description: "Dirección del cliente"

      - name: ciudad
        description: "Ciudad del cliente"

      - name: fnacimiento
        description: "Fecha de nacimiento"

      - name: falta
        description: "Fecha de alta"

      - name: fbaja
        description: "Fecha de baja"

      - name: genero
        description: "Género del cliente"

      - name: activo
        description: "Indicador de cliente activo"

      - name: creado_en
        description: "Fecha de creación del registro"

      - name: modificado_en
        description: "Fecha de modificación del registro"

  - name: stg_ejemplares
    description: >
      Modelo staging de ejemplares físicos. Unifica la tabla de ejemplares con
      la de ejemplares marcados para baja (ejemplares_para_borrar) mediante left
      join por la clave natural compuesta (id_libro, n_ejemplar). Cada ejemplar
      se enriquece con su motivo de baja, fecha de detección y estado de aprobación.
    columns:
      - name: id_libro
        description: "Identificador del libro. Clave natural compuesta junto a n_ejemplar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_libros')
                field: id_libro
      - name: n_ejemplar
        description: "Número de ejemplar dentro del libro. Clave natural compuesta junto a id_libro."
        tests:
          - not_null

      - name: estado
        description: "Estado físico del ejemplar."

      - name: f_adquisicion
        description: "Fecha de adquisición del ejemplar."

      - name: f_ultima_revision
        description: "Fecha de la última revisión del ejemplar."

      - name: ubicacion
        description: "Ubicación física del ejemplar en la biblioteca."

      - name: activo
        description: "Indicador de ejemplar activo (valor original sin normalizar)."

      - name: marcado_para_baja
        description: "True si el ejemplar aparece en ejemplares_para_borrar."

      - name: motivo_baja
        description: "Motivo de la baja (deterioro, pérdida, etc.). Null si no está marcado para baja."

      - name: f_deteccion_baja
        description: "Fecha en la que se detectó o registró la baja. Null si no aplica."

      - name: baja_aprobada
        description: "Indicador de si la baja ha sido aprobada. Null si no aplica."

      - name: creado_en
        description: "Fecha de creación del registro en origen."

      - name: modificado_en
        description: "Fecha de modificación del registro en origen."

  - name: stg_libros
    description: "Modelo staging de libros"
    columns:
      - name: id_libro
        tests:
          - not_null
          - unique

      - name: titulo

      - name: autor

      - name: isbn

      - name: genero

      - name: categoria

      - name: editorial

      - name: aniopublic

      - name: numpaginas

      - name: falta

      - name: activo

      - name: creado_en

      - name: modificado_en

  - name: stg_prestamos
    description: "Modelo staging de préstamos"
    columns:
      - name: idcliente
        data_tests:
          - relationships:
              arguments:
                 to: ref('stg_clientes')
                 field: id_cliente

      - name: idlibro
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_libros')
                field: id_libro

      - name: nejemplar

      - name: fentrega

      - name: fdevolucion

      - name: flimite

      - name: renovaciones

      - name: notas

      - name: creado_en

      - name: modificado_en

  - name: stg_reservas
    description: "Modelo staging de reservas"
    columns:
      - name: idreserva
        tests:
          - not_null
          - unique

      - name: idcliente
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_clientes')
                field: id_cliente

      - name: idlibro
        data_tests:
          - relationships:
              arguments: 
               to: ref('stg_libros')
               field: id_libro

      - name: freserva

      - name: fexpiracion

      - name: fatencion

      - name: estado

      - name: canal

      - name: notas

      - name: creado_en

      - name: modificado_en

  - name: stg_sanciones
    description: "Modelo staging de sanciones"
    columns:
      - name: idsancion
        tests:
          - not_null
          - unique

      - name: idcliente
        data_tests:
          - relationships:
              arguments: 
               to: ref('stg_clientes')
               field: id_cliente

      - name: idlibro
        data_tests:
          - relationships:
              arguments: 
               to: ref('stg_libros')
               field: id_libro

      - name: nejemplar

      - name: fentrega

      - name: tiposancion

      - name: descripcion

      - name: importe

      - name: fsancion

      - name: flimitepago

      - name: estado

      - name: fpago

      - name: metodopago