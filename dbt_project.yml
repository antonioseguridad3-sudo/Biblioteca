# dbt_project.yml
name: 'biblioteca'          # ✅ minúsculas obligatorio
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "ALTER SESSION SET TIMEZONE = 'Europe/Madrid'"   # ✅ SESSION (faltaba la N)

models:
  biblioteca:                                         # ✅ debe coincidir con name
    example:
      +materialized: table

    staging:
      +materialized: view
      +database: BIBLIOTECA_DEV_SILVER_DB
      raw_biblioteca:
        +schema: STAGING                              # ✅ mayúsculas consistentes

    marts:
      +materialized: table                            # ✅ quitado incremental genérico
      +database: BIBLIOTECA_DEV_GOLD_DB
      core:
        +schema: CORE
        dimensiones:
          +schema: DIMENSIONES
          +tags: ["dimension"]                        # ✅ corregido typo "dimensio"
        hechos:
          +schema: HECHOS
          +tags: ["hechos"]                           # ✅ formato consistente con comillas

seeds:
  biblioteca:                                        # ✅ minúsculas, igual que name
    +database: BIBLIOTECA_DEV_BRONZE_DB              # ✅ BRONZE (antes tenías BRONCE)
    +schema: BRONZE

snapshots:
  biblioteca:                                        # ✅ minúsculas, igual que name
    +database: BIBLIOTECA_DEV_SILVER_DB
    +schema: SNAPSHOTS